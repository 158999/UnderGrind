name: Humans Blend Source Audit

on:
  push:
    branches:
      - repair/humans-blend-audit
    paths:
      - 'Assets/UnderGrind/Art/Source/humans.blend'
      - 'Assets/Resources/BACKUPhumans.blend'
      - '.github/workflows/humans-blend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Inspect both source files
        run: |
          mkdir -p audit
          cat > audit_humans.py <<'PY'
          import bpy, json, os, sys
          from mathutils import Vector
          src = bpy.data.filepath
          objects = []
          for obj in sorted(bpy.data.objects, key=lambda x: x.name):
              row = {
                  "name": obj.name,
                  "type": obj.type,
                  "parent": obj.parent.name if obj.parent else None,
                  "location": list(obj.location),
                  "rotation_euler": list(obj.rotation_euler),
                  "scale": list(obj.scale),
                  "dimensions": list(obj.dimensions),
                  "hide_viewport": obj.hide_viewport,
                  "hide_render": obj.hide_render,
                  "modifiers": [{"name": m.name, "type": m.type, "show_viewport": m.show_viewport, "show_render": m.show_render,
                                 "object": m.object.name if m.type == "ARMATURE" and m.object else None,
                                 "use_axis": list(m.use_axis) if m.type == "MIRROR" else None,
                                 "use_clip": m.use_clip if m.type == "MIRROR" else None,
                                 "use_mirror_merge": m.use_mirror_merge if m.type == "MIRROR" else None} for m in obj.modifiers],
              }
              if obj.type == "MESH":
                  mesh = obj.data
                  xs = [v.co.x for v in mesh.vertices]
                  ys = [v.co.y for v in mesh.vertices]
                  zs = [v.co.z for v in mesh.vertices]
                  eps = max(1e-6, (max(xs)-min(xs))*0.01) if xs else 1e-6
                  row["mesh"] = {
                      "vertices": len(mesh.vertices), "edges": len(mesh.edges), "polygons": len(mesh.polygons),
                      "materials": [m.name if m else None for m in mesh.materials],
                      "vertex_groups": [g.name for g in obj.vertex_groups],
                      "weighted_vertices": sum(1 for v in mesh.vertices if len(v.groups)),
                      "bounds_local": {"min":[min(xs),min(ys),min(zs)] if xs else None,"max":[max(xs),max(ys),max(zs)] if xs else None},
                      "x_distribution": {"negative":sum(1 for x in xs if x < -eps),"center":sum(1 for x in xs if abs(x)<=eps),"positive":sum(1 for x in xs if x > eps)},
                      "polygon_area_total": sum(p.area for p in mesh.polygons),
                      "loose_vertices": sum(1 for v in mesh.vertices if not any(v.index in e.vertices for e in mesh.edges)),
                  }
              if obj.type == "ARMATURE":
                  row["bones"] = [{"name":b.name,"parent":b.parent.name if b.parent else None,"head":list(b.head_local),"tail":list(b.tail_local)} for b in obj.data.bones]
              objects.append(row)
          report = {"file": src, "blender_version": bpy.app.version_string,
                    "scene_names": [s.name for s in bpy.data.scenes],
                    "collections": [c.name for c in bpy.data.collections],
                    "object_count": len(objects), "objects": objects}
          out = os.environ["REPORT_PATH"]
          with open(out,"w",encoding="utf-8") as f: json.dump(report,f,indent=2)
          print("AUDIT_REPORT=" + out)
          PY
          for spec in "Assets/UnderGrind/Art/Source/humans.blend:current" "Assets/Resources/BACKUPhumans.blend:backup"; do
            file="${spec%%:*}"
            label="${spec##*:}"
            REPORT_PATH="audit/${label}.json" blender -b "$file" --python audit_humans.py
          done
      - uses: actions/upload-artifact@v4
        with:
          name: humans-blend-audit
          path: audit/*.json
          if-no-files-found: error
          retention-days: 7
