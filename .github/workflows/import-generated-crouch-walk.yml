name: Import generated PINOC crouch-walk samples

on:
  push:
    branches: [fix/crouch-walk-animation-validation]
    paths:
      - '.github/workflows/import-generated-crouch-walk.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crouch-walk-animation-validation

      - name: Download four generated Mixamo FBX samples
        shell: bash
        run: |
          set -euo pipefail
          folder="Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk"
          mkdir -p "$folder"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 'https://cdn.viggle.ai/3d-editor-assets/text2motion/6aa1752e-9788-4ebf-96c0-15ca7caa00b9/sample_00.fbx?Expires=1795528800&KeyName=vigglecloudcdn2&Signature=rYli-rW1Z9-QGQbgAiMbfT7RtXM' --output "$folder/Crouch_Walk_Generated_01.fbx"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 'https://cdn.viggle.ai/3d-editor-assets/text2motion/6aa1752e-9788-4ebf-96c0-15ca7caa00b9/sample_01.fbx?Expires=1795528800&KeyName=vigglecloudcdn2&Signature=jj_vMnT2Ctb-DBO4pVod8DxL--o' --output "$folder/Crouch_Walk_Generated_02.fbx"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 'https://cdn.viggle.ai/3d-editor-assets/text2motion/6aa1752e-9788-4ebf-96c0-15ca7caa00b9/sample_02.fbx?Expires=1795528800&KeyName=vigglecloudcdn2&Signature=_jrulUr273ZI7IrqjoJGJ8ZDuJA' --output "$folder/Crouch_Walk_Generated_03.fbx"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 'https://cdn.viggle.ai/3d-editor-assets/text2motion/6aa1752e-9788-4ebf-96c0-15ca7caa00b9/sample_03.fbx?Expires=1795528800&KeyName=vigglecloudcdn2&Signature=7O9Qh6nlqx6imIpy7z8Oz6BTemo' --output "$folder/Crouch_Walk_Generated_04.fbx"
          for file in "$folder"/Crouch_Walk_Generated_*.fbx; do
            test -s "$file"
            size=$(stat -c %s "$file")
            if [ "$size" -lt 10000 ]; then
              echo "Invalid or truncated FBX: $file ($size bytes)"
              exit 1
            fi
            echo "$file: $size bytes"
          done

      - name: Create Humanoid import metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          folder = Path("Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk")
          template_path = folder / "Crouch_Walk_Candidate_01.fbx.meta"
          template = template_path.read_text(encoding="utf-8")
          template = template.replace("guid: 6dff3f2b250b450687127e12f3988296",
                                      "guid: REPLACE_GUID")
          template = template.replace("lastFrame: 239", "lastFrame: 179")
          entries = {
              "Crouch_Walk_Generated_01.fbx": "719e4b83ae1443d3b743f0eed22c0b13",
              "Crouch_Walk_Generated_02.fbx": "3065a0002fcf40b782e37743603b2feb",
              "Crouch_Walk_Generated_03.fbx": "ef71b956591642bfb269e3e162849ea0",
              "Crouch_Walk_Generated_04.fbx": "8d3244f18ba346c8a2558bc75c8ee7f0",
          }
          for filename, guid in entries.items():
              meta = template.replace("REPLACE_GUID", guid)
              (folder / (filename + ".meta")).write_text(meta, encoding="utf-8")
          PY

      - name: Commit generated candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          folder="Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk"
          git add "$folder"/Crouch_Walk_Generated_*.fbx "$folder"/Crouch_Walk_Generated_*.fbx.meta
          git diff --cached --quiet && { echo "No generated motion files were imported"; exit 1; }
          git commit -m "assets: add generated crouch walk candidates"
          git push origin HEAD:fix/crouch-walk-animation-validation
