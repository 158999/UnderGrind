name: Humans Blend Repair

on:
  push:
    branches:
      - repair/humans-blend-audit
    paths:
      - '.github/workflows/humans-blend-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Repair rigged half-meshes
        run: |
          cat > repair_humans.py <<'PY'
          import bpy, json, os
          from mathutils import Matrix
          from collections import defaultdict

          src = "Assets/UnderGrind/Art/Source/humans.blend"
          out = "humans_repaired.blend"
          bpy.ops.wm.open_mainfile(filepath=src)

          # Only rigged mesh pieces: base Human_Female/Human_Male already have Mirror.
          targets = [o for o in bpy.data.objects if o.type == "MESH" and o.name not in ("Human_Female", "Human_Male") and any(m.type == "ARMATURE" for m in o.modifiers)]
          report = {"targets": [], "errors": []}

          def group_pairs(obj):
              names = {g.name for g in obj.vertex_groups}
              pairs = {}
              for n in names:
                  if n.startswith("Left"):
                      other = "Right" + n[4:]
                      if other in names: pairs[n] = other
                  elif n.startswith("Right"):
                      other = "Left" + n[5:]
                      if other in names: pairs[n] = other
              return pairs

          for obj in targets:
              mesh = obj.data
              if len(mesh.vertices) == 0:
                  report["errors"].append(obj.name + ": empty mesh")
                  continue
              # Require a one-sided source mesh. Existing centerline vertices remain shared.
              xs = [v.co.x for v in mesh.vertices]
              pos = sum(x > 1e-5 for x in xs)
              neg = sum(x < -1e-5 for x in xs)
              if pos == 0 or neg > 0:
                  report["errors"].append(f"{obj.name}: unexpected local X distribution pos={pos}, neg={neg}; skipped")
                  continue

              pairs = group_pairs(obj)
              # Duplicate original vertices/faces across local X=0, swapping left/right weights.
              old_v_count = len(mesh.vertices)
              old_polys = [tuple(p.vertices) for p in mesh.polygons]
              old_weights = []
              for v in mesh.vertices:
                  weights = {}
                  for g in v.groups:
                      if g.group < len(obj.vertex_groups):
                          weights[obj.vertex_groups[g.group].name] = g.weight
                  old_weights.append(weights)

              # Add mirrored vertices, preserving centerline vertices without duplication.
              new_coords = [(-v.co.x, v.co.y, v.co.z) for v in mesh.vertices]
              new_index = {}
              for i, co in enumerate(new_coords):
                  if abs(mesh.vertices[i].co.x) <= 1e-5:
                      new_index[i] = i
                  else:
                      new_index[i] = len(mesh.vertices)
                      mesh.vertices.add(1)
                      mesh.vertices[-1].co = co
              # Add reversed-winding mirrored faces.
              for poly in old_polys:
                  ids = [new_index[i] for i in reversed(poly)]
                  if len(set(ids)) >= 3:
                      mesh.polygons.add(1)
                      mesh.polygons[-1].vertices = ids
              # Assign mirrored weights to duplicated vertices.
              for i, ni in new_index.items():
                  if ni == i: continue
                  weights = old_weights[i]
                  for group_name, weight in weights.items():
                      mirrored_name = pairs.get(group_name, group_name)
                      try:
                          obj.vertex_groups[mirrored_name].add([ni], weight, 'REPLACE')
                      except Exception as exc:
                          report["errors"].append(f"{obj.name}: weight {mirrored_name}: {exc}")
              mesh.update()
              report["targets"].append({
                  "name": obj.name, "vertices_before": old_v_count, "vertices_after": len(mesh.vertices),
                  "faces_before": len(old_polys), "faces_after": len(mesh.polygons),
                  "group_pairs": pairs, "negative_x_vertices_after": sum(1 for v in mesh.vertices if v.co.x < -1e-5)
              })

          # Keep the original Armature modifier and stack. No destructive changes to source file.
          bpy.ops.wm.save_as_mainfile(filepath=out)
          with open("repair-report.json", "w") as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          if report["errors"]:
              raise RuntimeError("Repair has validation errors; inspect repair-report.json")
          if len(report["targets"]) != 12:
              raise RuntimeError(f"Expected 12 rigged meshes, repaired {len(report['targets'])}")
          PY
          blender -b --python repair_humans.py
      - name: Upload repaired source and report
        uses: actions/upload-artifact@v4
        with:
          name: humans-repaired-candidate
          path: |
            humans_repaired.blend
            repair-report.json
          if-no-files-found: error
          retention-days: 14
