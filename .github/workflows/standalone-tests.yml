name: Standalone Diagnostics Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-tests:
    name: Build and test diagnostics
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Python for Blender script syntax checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Blender Python tooling syntax
        shell: pwsh
        run: python -m py_compile ./Tools/Blender/export-undergrind-humans.py

      - name: Validate PowerShell test scripts
        shell: pwsh
        run: |
          $parseFailures = @()
          @("./Tools/Testing", "./Tools/Blender") | ForEach-Object {
            Get-ChildItem $_ -Filter *.ps1 -File
          } | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              $parseFailures += "$($_.Name): $($parseError.Message) (line $($parseError.Extent.StartLineNumber))"
            }
          }
          if ($parseFailures.Count -gt 0) {
            $parseFailures | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax validation failed."
          }
          Write-Host "PowerShell tooling scripts: syntax valid."
          $launcher = Get-Content "./TESTA.bat" -Raw
          if ($launcher -notmatch '(?im)run-all-tests\.ps1') {
            throw "TESTA.bat must invoke the complete test orchestrator."
          }
          if ($launcher -notmatch '(?im)exit\s+/b\s+%TEST_EXIT%') {
            throw "TESTA.bat must propagate the aggregate test exit code."
          }
          if ($launcher -match '(?im)run-tests\.ps1|run-unity-tests\.ps1') {
            throw "TESTA.bat must not launch test phases separately."
          }
          Write-Host "TESTA.bat orchestration and exit-code propagation: valid."
      - name: Verify child-process exit code handling (Windows PowerShell 5.1)
        shell: powershell
        run: ./Tools/Testing/test-process-runner.ps1

      - name: Run standalone tests
        shell: pwsh
        run: ./Tools/Testing/run-tests.ps1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: undergrind-standalone-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 30
