name: Standalone Diagnostics Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-tests:
    name: Build and test diagnostics
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate PowerShell test scripts
        shell: pwsh
        run: |
          $parseFailures = @()
          Get-ChildItem ./Tools/Testing -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              $parseFailures += "$($_.Name): $($parseError.Message) (line $($parseError.Extent.StartLineNumber))"
            }
          }
          if ($parseFailures.Count -gt 0) {
            $parseFailures | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax validation failed."
          }
          Write-Host "PowerShell test scripts: syntax valid."
      - name: Run standalone tests
        shell: pwsh
        run: ./Tools/Testing/run-tests.ps1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: undergrind-standalone-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 30
