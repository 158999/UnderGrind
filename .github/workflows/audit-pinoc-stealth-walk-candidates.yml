name: Audit raw FBX crouch-walk candidates

on:
  push:
    branches:
      - 'fix/crouch-walk-*'
    paths:
      - 'Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/**'
      - 'Tools/Blender/audit-pinoc-crouch-walk-candidates.py'
      - '.github/workflows/audit-pinoc-stealth-walk-candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify candidate FBXs
        shell: bash
        run: |
          set -euo pipefail
          for file in Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/Crouch_Walk_Candidate_0{1,2,3,4,5,6,7,8}.fbx; do
            test -s "$file"
            size=$(stat -c %s "$file")
            if [ "$size" -lt 10000 ]; then
              echo "Invalid or truncated FBX: $file ($size bytes)"
              exit 1
            fi
            printf '%s %s bytes\n' "$file" "$size"
          done

      - name: Install Blender
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            https://mirror.blender.org/release/Blender5.2/blender-5.2.4-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/blender.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.4-linux-x64" >> "$GITHUB_PATH"

      - name: Audit current source and all eight candidates
        run: blender -b --python Tools/Blender/audit-pinoc-crouch-walk-candidates.py

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tools/Blender/pinoc-crouch-walk-candidate-audit.json
          if git diff --cached --quiet; then
            echo "Audit report unchanged"
            exit 0
          fi
          git commit -m "test: refresh crouch-walk candidate audit"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: pinoc-crouch-walk-candidate-audit
          path: Tools/Blender/pinoc-crouch-walk-candidate-audit.json
          if-no-files-found: error
          retention-days: 14
