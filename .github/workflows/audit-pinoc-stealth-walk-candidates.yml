name: Audit new PINOC stealth-walk candidates

on:
  push:
    branches:
      - fix/crouch-walk-animation-audit
    paths:
      - '.github/workflows/audit-pinoc-stealth-walk-candidates.yml'
      - 'Tools/Blender/audit-pinoc-crouch-walk-candidates.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download four new in-place stealth-walk candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 'https://cdn.viggle.ai/3d-editor-assets/text2motion/827b8373-42df-479a-a82f-22b5a339678d/sample_00.fbx?Expires=1795521600&KeyName=vigglecloudcdn2&Signature=wPWMz2HP0Ni12HVWU3PiCuGksck' --output Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/Crouch_Walk_Candidate_05.fbx
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 'https://cdn.viggle.ai/3d-editor-assets/text2motion/827b8373-42df-479a-a82f-22b5a339678d/sample_01.fbx?Expires=1795521600&KeyName=vigglecloudcdn2&Signature=Hh0OLdSaXt-lZNgXlU_i_228u2I' --output Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/Crouch_Walk_Candidate_06.fbx
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 'https://cdn.viggle.ai/3d-editor-assets/text2motion/827b8373-42df-479a-a82f-22b5a339678d/sample_02.fbx?Expires=1795521600&KeyName=vigglecloudcdn2&Signature=SzRKlUYHEYd4q4YC3JWbuzwCzZg' --output Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/Crouch_Walk_Candidate_07.fbx
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 'https://cdn.viggle.ai/3d-editor-assets/text2motion/827b8373-42df-479a-a82f-22b5a339678d/sample_03.fbx?Expires=1795521600&KeyName=vigglecloudcdn2&Signature=TOZP0jzPP_xOnICmbWgp3-tQbE0' --output Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/Crouch_Walk_Candidate_08.fbx
          for file in Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/Crouch_Walk_Candidate_0{5,6,7,8}.fbx; do
            test -s "$file"
            size=$(stat -c %s "$file")
            if [ "$size" -lt 10000 ]; then
              echo "Invalid or truncated FBX: $file ($size bytes)"
              exit 1
            fi
            printf '%s %s bytes\n' "$file" "$size"
          done

      - name: Install Blender
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            https://mirror.blender.org/release/Blender5.2/blender-5.2.4-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/blender.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.4-linux-x64" >> "$GITHUB_PATH"

      - name: Audit current source and all eight candidates
        run: blender -b --python Tools/Blender/audit-pinoc-crouch-walk-candidates.py

      - name: Commit candidate files and audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/Crouch_Walk_Candidate_0{5,6,7,8}.fbx
          git add Tools/Blender/pinoc-crouch-walk-candidate-audit.json
          git diff --cached --quiet && { echo "No new candidates or audit changes"; exit 1; }
          git commit -m "assets: add audited stealth-walk candidates"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: pinoc-stealth-walk-candidate-audit
          path: Tools/Blender/pinoc-crouch-walk-candidate-audit.json
          if-no-files-found: error
          retention-days: 14
