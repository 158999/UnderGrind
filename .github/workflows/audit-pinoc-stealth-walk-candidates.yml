name: Audit raw FBX crouch-walk candidates

on:
  push:
    branches:
      - 'fix/crouch-walk-*'
    paths:
      - 'Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/**'
      - 'Tools/Blender/audit-pinoc-crouch-walk-candidates.py'
      - '.github/workflows/audit-pinoc-stealth-walk-candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: startsWith(github.ref_name, 'fix/crouch-walk-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify candidate FBXs
        shell: bash
        run: |
          set -euo pipefail
          folder="Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk"
          for file in "$folder"/Crouch_Walk_Candidate_*.fbx "$folder"/Crouch_Walk_Generated_*.fbx; do
            test -s "$file"
            size=$(stat -c %s "$file")
            if [ "$size" -lt 10000 ]; then
              echo "Invalid or truncated FBX: $file ($size bytes)"
              exit 1
            fi
            printf '%s %s bytes\n' "$file" "$size"
          done

      - name: Install headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libxkbcommon0 libxrender1 libxi6 libxfixes3 libxext6 python3-pil

      - name: Validate Blender audit script syntax
        run: python3 -m py_compile Tools/Blender/audit-pinoc-crouch-walk-candidates.py

      - name: Install Blender
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            https://mirror.blender.org/release/Blender5.2/blender-5.2.4-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/blender.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.4-linux-x64" >> "$GITHUB_PATH"

      - name: Audit current source and all available candidates
        run: blender -b --python Tools/Blender/audit-pinoc-crouch-walk-candidates.py

      - name: Assemble Blender preview contact sheets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path("Tools/Blender/pinoc-crouch-walk-previews")
          views = ("front", "side", "rear", "opposite")
          frame_count = 6
          for folder in sorted(root.iterdir()) if root.exists() else []:
              if not folder.is_dir():
                  continue
              first = folder / f"{views[0]}_00.png"
              if not first.exists():
                  continue
              with Image.open(first) as image:
                  width, height = image.size
              sheet = Image.new("RGB", (width * len(views), height * frame_count), (24, 24, 24))
              draw = ImageDraw.Draw(sheet)
              for column, view in enumerate(views):
                  draw.text((column * width + 5, 5), view, fill=(255, 255, 255))
                  for row in range(frame_count):
                      frame_path = folder / f"{view}_{row:02d}.png"
                      if not frame_path.exists():
                          continue
                      with Image.open(frame_path) as image:
                          sheet.paste(image.convert("RGB"), (column * width, row * height))
              sheet.save(folder / "contact-sheet.png")
              for frame_path in folder.glob("*_*.png"):
                  frame_path.unlink()
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          folder="Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk"
          git add "$folder"/Crouch_Walk_Generated_*.fbx "$folder"/Crouch_Walk_Generated_*.fbx.meta Tools/Blender/pinoc-crouch-walk-candidate-audit.json
          if git diff --cached --quiet; then
            echo "Audit report unchanged"
            exit 0
          fi
          git commit -m "test: refresh crouch-walk candidate audit"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload audit report and visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinoc-crouch-walk-audit-and-previews
          path: |
            Tools/Blender/pinoc-crouch-walk-candidate-audit.json
            Tools/Blender/pinoc-crouch-walk-previews/
            Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/Crouch_Walk_Generated_*.fbx
            Assets/UnderGrind/Animations/Candidates/PINOC_CrouchWalk/Crouch_Walk_Generated_*.fbx.meta
          if-no-files-found: error
          retention-days: 14
